name: Build Marakana Mobile Native v34 RELEASE APK

on:
  workflow_dispatch:
  push:
    branches: [ main, master ]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Validate signing secrets
        env:
          KS_B64: ${{ secrets.MARAKANA_KEYSTORE_BASE64 }}
          KS_PASS: ${{ secrets.MARAKANA_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.MARAKANA_KEY_ALIAS }}
          KEY_PASS: ${{ secrets.MARAKANA_KEY_PASSWORD }}
        shell: bash
        run: |
          test -n "$KS_B64" || { echo "Missing MARAKANA_KEYSTORE_BASE64"; exit 1; }
          test -n "$KS_PASS" || { echo "Missing MARAKANA_KEYSTORE_PASSWORD"; exit 1; }
          test -n "$KEY_ALIAS" || { echo "Missing MARAKANA_KEY_ALIAS"; exit 1; }
          test -n "$KEY_PASS" || { echo "Missing MARAKANA_KEY_PASSWORD"; exit 1; }

      - name: Restore permanent release keystore
        env:
          KS_B64: ${{ secrets.MARAKANA_KEYSTORE_BASE64 }}
        shell: bash
        run: |
          KEYSTORE_PATH="$RUNNER_TEMP/marakana-mobile-release.jks"
          printf '%s' "$KS_B64" | base64 --decode > "$KEYSTORE_PATH"
          chmod 600 "$KEYSTORE_PATH"
          echo "MARAKANA_KEYSTORE_PATH=$KEYSTORE_PATH" >> "$GITHUB_ENV"

      - name: Build signed release APK
        env:
          MARAKANA_KEYSTORE_PASSWORD: ${{ secrets.MARAKANA_KEYSTORE_PASSWORD }}
          MARAKANA_KEY_ALIAS: ${{ secrets.MARAKANA_KEY_ALIAS }}
          MARAKANA_KEY_PASSWORD: ${{ secrets.MARAKANA_KEY_PASSWORD }}
        run: gradle --no-daemon :app:assembleRelease

      - name: Prepare versioned APK
        run: cp app/build/outputs/apk/release/app-release.apk MarakanaMobile-v34-release.apk

      - name: Verify APK signature
        shell: bash
        run: |
          APKSIGNER=$(find "$ANDROID_HOME/build-tools" -type f -name apksigner | sort -V | tail -n 1)
          "$APKSIGNER" verify --print-certs MarakanaMobile-v34-release.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: MarakanaMobile-v34-permanent-update-apk
          path: MarakanaMobile-v34-release.apk
          if-no-files-found: error
