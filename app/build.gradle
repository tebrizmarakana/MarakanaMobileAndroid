plugins {
    id 'com.android.application'
}

android {
    namespace 'az.marakana.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'az.marakana.mobile'
        minSdk 26
        targetSdk 35
        versionCode 12
        versionName '2.7.0-native-v12'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
