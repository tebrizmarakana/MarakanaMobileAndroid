plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("MARAKANA_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("MARAKANA_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("MARAKANA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MARAKANA_KEY_PASSWORD")
def releaseSigningReady = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'az.marakana.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'az.marakana.mobile'
        minSdk 26
        targetSdk 35
        versionCode 171
        versionName '3.5.32-native-v171'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Update APK-ları yalnız daimi release sertifikatı ilə çıxır.
            // Signing env-ləri yoxdursa aşağıdakı task guard build-i dayandırır;
            // səhv/unsigned APK yaradılıb telefonda "tətbiq quraşdırılmadı" verməsinin qarşısı alınır.
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    // Fully embedded QR camera, bundled/offline recognition model (no external app).
    implementation 'androidx.activity:activity:1.10.1'
    implementation 'androidx.core:core:1.15.0'
    implementation 'androidx.camera:camera-camera2:1.4.2'
    implementation 'androidx.camera:camera-lifecycle:1.4.2'
    implementation 'androidx.camera:camera-view:1.4.2'
    implementation 'com.google.mlkit:barcode-scanning:17.3.0' 
}

// v146: Release signing təhlükəsizliyi saxlanılır; v145 Filtr compile scope xətası düzəldildi.
tasks.matching { it.name in ["assembleRelease", "bundleRelease", "packageRelease"] }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException("Marakana Mobile release signing məlumatları yoxdur. Update APK yaratmaq üçün daimi MARAKANA_KEYSTORE_* env dəyişənlərini istifadə edin.")
        }
    }
}

