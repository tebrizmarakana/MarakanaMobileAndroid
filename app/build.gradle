plugins {
    id 'com.android.application'
}

android {
    namespace 'az.marakana.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'az.marakana.mobile'
        minSdk 26
        targetSdk 35
        versionCode 16
        versionName '3.0.0-native-v16'
    }

    buildTypes {
        release {
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
