plugins {
    id 'com.android.application'
}

def releaseKeystorePath = System.getenv("MARAKANA_KEYSTORE_PATH")
def releaseKeystorePassword = System.getenv("MARAKANA_KEYSTORE_PASSWORD")
def releaseKeyAlias = System.getenv("MARAKANA_KEY_ALIAS")
def releaseKeyPassword = System.getenv("MARAKANA_KEY_PASSWORD")
def releaseSigningReady = [releaseKeystorePath, releaseKeystorePassword, releaseKeyAlias, releaseKeyPassword]
        .every { it != null && !it.trim().isEmpty() }

android {
    namespace 'az.marakana.mobile'
    compileSdk 35

    defaultConfig {
        applicationId 'az.marakana.mobile'
        minSdk 26
        targetSdk 35
        versionCode 145
        versionName '3.5.07-native-v145'
    }

    signingConfigs {
        release {
            if (releaseSigningReady) {
                storeFile file(releaseKeystorePath)
                storePassword releaseKeystorePassword
                keyAlias releaseKeyAlias
                keyPassword releaseKeyPassword
            }
        }
    }

    buildTypes {
        release {
            // Update APK-ları yalnız daimi release sertifikatı ilə çıxır.
            // Signing env-ləri yoxdursa aşağıdakı task guard build-i dayandırır;
            // səhv/unsigned APK yaradılıb telefonda "tətbiq quraşdırılmadı" verməsinin qarşısı alınır.
            if (releaseSigningReady) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android-optimize.txt'), 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}

dependencies {
    implementation 'androidx.swiperefreshlayout:swiperefreshlayout:1.1.0'
    implementation 'com.google.android.gms:play-services-code-scanner:16.1.0'
}

// v145: Release signing təhlükəsizliyi saxlanılır; Hesab Satışında Filtr düyməsi, Növ/Konsol filtrləri və bölmə dəyişəndə filtr sıfırlanması əlavə edildi.
tasks.matching { it.name in ["assembleRelease", "bundleRelease", "packageRelease"] }.configureEach {
    doFirst {
        if (!releaseSigningReady) {
            throw new GradleException("Marakana Mobile release signing məlumatları yoxdur. Update APK yaratmaq üçün daimi MARAKANA_KEYSTORE_* env dəyişənlərini istifadə edin.")
        }
    }
}
